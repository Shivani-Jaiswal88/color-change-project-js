<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Change Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="color-card">
            <h1>Background Color Changer</h1>
            <div class="color-info">
                <span>Current Color:</span>
                <strong id="color-text">#F4F6F8</strong>
            </div>
            <div class="color-buttons">
                <button class="color-btn" data-color="#3498db" style="--btn-color: #3498db;">Blue</button>
                <button class="color-btn" data-color="#2ecc71" style="--btn-color: #2ecc71;">Green</button>
                <button class="color-btn" data-color="#e74c3c" style="--btn-color: #e74c3c;">Red</button>
                <button class="color-btn" data-color="#f1c40f" style="--btn-color: #f1c40f;">Yellow</button>
                <button class="color-btn" data-color="#9b59b6" style="--btn-color: #9b59b6;">Purple</button>
                <button class="color-btn" data-color="#f4f6f8" style="--btn-color: #333333;">Reset</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
